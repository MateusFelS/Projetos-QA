name: DemoBlaze Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  DemoBlaze-Test:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: playwright/demo-blaze/playwright/package-lock.json

      - name: Install dependencies
        working-directory: playwright/demo-blaze/playwright
        run: npm ci

      - name: Install Playwright browsers
        working-directory: playwright/demo-blaze/playwright
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        working-directory: playwright/demo-blaze/playwright
        run: npx playwright test

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright/demo-blaze/playwright/playwright-report/
          retention-days: 30
